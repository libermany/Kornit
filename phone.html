<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incoming Phone Number</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; background:#f3f4f6; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
  .card { background:#fff; padding:32px 48px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.12); text-align:center; }
  #phone { font-size:36px; font-weight:600; margin:12px 0; }
  .msg { color:#666; font-size:14px; }
</style>
</head>
<body>
<div class="card">
  <div>Phone number</div>
  <div id="phone">-</div>
  <div class="msg" id="msg"></div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  // accepted parameter names: phone, number, ani, tel
  const phone = (params.get('phone') || params.get('number') || params.get('ani') || params.get('tel') || '').trim();
  const el = document.getElementById('phone');

  if (phone) {
    // tel: link + plain text so the Genesys Cloud click-to-dial extension (Chrome/Firefox) picks it up
    const link = document.createElement('a');
    link.href = 'tel:' + phone.replace(/[^\d+]/g, '');
    link.textContent = phone;
    link.style.color = 'inherit';
    el.textContent = '';
    el.appendChild(link);
  } else {
    document.getElementById('msg').textContent = 'No phone number in URL. Use ?phone=0501234567';
  }
</script>
</body>
</html>
