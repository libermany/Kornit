<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=yes">
<style>
  html, body { margin:0; padding:0; background:#fff; }
  body { font-family: Arial, sans-serif; font-size:12pt; line-height:1.2; }
  #phone a { color:inherit; text-decoration:none; }
  #msg { color:#c00; }
</style>
</head>
<body><span id="phone"></span><span id="msg"></span>
<script>
  // URL: phone.html?phone=0501234567  (also accepts number, ani, tel)
  var p = new URLSearchParams(location.search);
  var phone = (p.get('phone') || p.get('number') || p.get('ani') || p.get('tel') || '').trim();

  if (phone) {
    // plain visible text inside a tel: link so the Genesys Cloud click-to-dial extension can detect it
    var a = document.createElement('a');
    a.href = 'tel:' + phone.replace(/[^\d+]/g, '');
    a.textContent = phone;
    document.getElementById('phone').appendChild(a);
  } else {
    document.getElementById('msg').textContent = 'No phone number in URL';
  }
</script>
</body>
</html>
