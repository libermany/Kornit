<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=yes">
<style>
  body { font-family: Segoe UI, Arial, sans-serif; background:#f3f4f6; margin:0; }
  .card { background:#fff; max-width:420px; margin:15vh auto 0; padding:32px 48px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.12); text-align:center; }
  .label { color:#666; font-size:14px; }
  #phone { font-size:36px; font-weight:600; margin:12px 0; }
  #phone a { color:inherit; text-decoration:none; }
  #msg { color:#c00; font-size:14px; }
</style>
</head>
<body>
<div class="card">
  <!-- plain visible text + tel: link so the Genesys Cloud click-to-dial extension can detect it -->
  <div id="phone"></div>
  <div id="msg"></div>
</div>
<script>
  // URL: phone.html?phone=0501234567  (also accepts number, ani, tel)
  var p = new URLSearchParams(location.search);
  var phone = (p.get('phone') || p.get('number') || p.get('ani') || p.get('tel') || '').trim();
  var el = document.getElementById('phone');

  if (phone) {
    var a = document.createElement('a');
    a.href = 'tel:' + phone.replace(/[^\d+]/g, '');
    a.textContent = phone;
    el.appendChild(a);
  } else {
    document.getElementById('msg').textContent = 'No phone number in URL. Use ?phone=0501234567';
  }
</script>
</body>
</html>
